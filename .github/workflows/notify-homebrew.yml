name: Notify Homebrew Tap

on:
  release:
    types: [published]

jobs:
  notify:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify the Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          : "${HOMEBREW_TAP_TOKEN:?Set the HOMEBREW_TAP_TOKEN repository secret}"
          curl --fail-with-body --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${HOMEBREW_TAP_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/flora-suite/homebrew-flora/dispatches \
            --data "{\"event_type\":\"flora-release\",\"client_payload\":{\"tag\":\"${RELEASE_TAG}\"}}"
